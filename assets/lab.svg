    <rect x="14" y="38" width="140" height="96" rx="8" fill="#0C1218" stroke="#223041"/>
    <g>
      <rect x="24" y="50" width="120" height="22" rx="4" fill="#1A2533"/>
      <rect x="30" y="56" width="10" height="10" rx="2" fill="#E28A3C"/>
      <rect x="48" y="58" width="56" height="6" rx="3" fill="#2A3747"/>
      <rect x="24" y="76" width="120" height="22" rx="4" fill="#131C27"/>
      <rect x="30" y="82" width="10" height="10" rx="2" fill="#3B4A5E"/>
      <rect x="48" y="84" width="44" height="6" rx="3" fill="#1E2937"/>
      <rect x="24" y="102" width="120" height="22" rx="4" fill="#131C27"/>
      <rect x="30" y="108" width="10" height="10" rx="2" fill="#3B4A5E"/>
      <rect x="48" y="110" width="64" height="6" rx="3" fill="#1E2937"/>
