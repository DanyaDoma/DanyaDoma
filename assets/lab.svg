    <text x="14" y="156" class="mono" font-size="10.5" fill="#E28A3C">CSS · HTML</text>
    <text x="14" y="186" class="sans" font-size="13" fill="#98A4B3">Изометрические</text>
    <text x="14" y="205" class="sans" font-size="13" fill="#98A4B3">плитки на CSS</text>
    <circle cx="19" cy="228" r="3" fill="#5BD6A4"/>
    <text x="28" y="232" class="mono" font-size="10.5" fill="#6E7B8B">1 коммит</text>
  </g>

