<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="labTitle labDesc">
  <title id="labTitle">Лаборатория: пять публичных UI-экспериментов</title>
  <desc id="labDesc">ProductCard, 3DTiles, IconTitle, LoginMenu и Shop-ModMenu — вёрстка, анимации и мини-интерфейсы на HTML, CSS и JavaScript, декабрь 2025.</desc>
  <defs>
    <linearGradient id="lbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111925"/>
      <stop offset="1" stop-color="#0A0F15"/>
    </linearGradient>
    <radialGradient id="lglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E28A3C" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#E28A3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="lgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .card { transition: none; }
    </style>
  </defs>

  <rect width="1000" height="400" rx="20" fill="url(#lbg)"/>
  <ellipse cx="180" cy="420" rx="340" ry="220" fill="url(#lglow)"/>
  <rect width="1000" height="400" rx="20" filter="url(#lgrain)" opacity="0.4"/>
  <rect x="0.75" y="0.75" width="998.5" height="398.5" rx="19.5" fill="none" stroke="#293443" stroke-width="1.5"/>

  <text x="54" y="46" class="mono" font-size="12" letter-spacing="2.4" fill="#6E7B8B">ЛАБОРАТОРИЯ / UI-ЭКСПЕРИМЕНТЫ</text>
  <text x="946" y="46" text-anchor="end" class="mono" font-size="11.5" letter-spacing="1.4" fill="#6E7B8B">5 РЕПОЗИТОРИЕВ · ДЕКАБРЬ 2025</text>
  <line x1="54" y1="62" x2="946" y2="62" stroke="#1F2936"/>

  <!-- 01 ProductCard -->
  <g transform="translate(54,80)">
    <rect width="168" height="250" rx="12" fill="#111925" stroke="#293443"/>
    <text x="14" y="27" class="sans" font-size="17" font-weight="600" fill="#F4F0E8">ProductCard</text>
    <rect x="14" y="38" width="140" height="96" rx="8" fill="#0C1218" stroke="#223041"/>
    <rect x="24" y="48" width="88" height="52" rx="6" fill="#1A2533"/>
    <path d="M38 86c10-14 18-14 27 0" fill="none" stroke="#3B4A5E" stroke-width="2"/>
    <path d="M47 91h18l6-9" fill="none" stroke="#E28A3C" stroke-width="2" stroke-linecap="round"/>
    <rect x="24" y="108" width="72" height="6" rx="3" fill="#2A3747"/>
    <rect x="24" y="120" width="38" height="6" rx="3" fill="#E28A3C" opacity="0.8"/>
    <rect x="122" y="104" width="24" height="24" rx="7" fill="#241A10" stroke="#7A4A1E"/>
    <path d="M134 110v12M128 116h12" stroke="#F0A35E" stroke-width="1.6" stroke-linecap="round"/>
    <text x="14" y="156" class="mono" font-size="10.5" fill="#E28A3C">CSS · HTML · JS</text>
    <text x="14" y="186" class="sans" font-size="13" fill="#98A4B3">Карточка товара</text>
    <text x="14" y="205" class="sans" font-size="13" fill="#98A4B3">с ценой и кнопкой</text>
    <circle cx="19" cy="228" r="3" fill="#5BD6A4"/>
    <text x="28" y="232" class="mono" font-size="10.5" fill="#6E7B8B">1 коммит</text>
  </g>

