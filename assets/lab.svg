    <text x="14" y="27" class="sans" font-size="17" font-weight="600" fill="#F4F0E8">LoginMenu</text>
    <rect x="14" y="38" width="140" height="96" rx="8" fill="#0C1218" stroke="#223041"/>
    <rect x="40" y="48" width="88" height="76" rx="6" fill="#131C27" stroke="#273445"/>
    <circle cx="84" cy="62" r="7" fill="none" stroke="#5A6779" stroke-width="1.4"/>
    <rect x="50" y="76" width="68" height="12" rx="3" fill="#0C1218" stroke="#2C3746"/>
    <rect x="50" y="93" width="68" height="12" rx="3" fill="#0C1218" stroke="#2C3746"/>
    <rect x="50" y="110" width="68" height="10" rx="5" fill="#E28A3C" opacity="0.85"/>
    <text x="14" y="156" class="mono" font-size="10.5" fill="#E28A3C">CSS · HTML</text>
    <text x="14" y="186" class="sans" font-size="13" fill="#98A4B3">Форма входа</text>
