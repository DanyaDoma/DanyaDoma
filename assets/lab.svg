    <text x="14" y="27" class="sans" font-size="17" font-weight="600" fill="#F4F0E8">IconTitle</text>
    <rect x="14" y="38" width="140" height="96" rx="8" fill="#0C1218" stroke="#223041"/>
    <circle cx="44" cy="72" r="15" fill="none" stroke="#E28A3C" stroke-width="1.8"/>
    <path d="M39 72l4 4 7-8" fill="none" stroke="#E28A3C" stroke-width="1.8" stroke-linecap="round"/>
    <rect x="68" y="62" width="62" height="7" rx="3.5" fill="#2A3747"/>
    <rect x="68" y="76" width="42" height="7" rx="3.5" fill="#1E2937"/>
    <rect x="24" y="102" width="118" height="5" rx="2.5" fill="#1E2937"/>
    <rect x="24" y="114" width="88" height="5" rx="2.5" fill="#1E2937"/>
    <text x="14" y="156" class="mono" font-size="10.5" fill="#E28A3C">HTML · CSS</text>
    <text x="14" y="186" class="sans" font-size="13" fill="#98A4B3">Иконка, заголовок,</text>
