    <text x="14" y="27" class="sans" font-size="17" font-weight="600" fill="#F4F0E8">3DTiles</text>
    <rect x="14" y="38" width="140" height="96" rx="8" fill="#0C1218" stroke="#223041"/>
    <g stroke="#33404F" stroke-width="1">
