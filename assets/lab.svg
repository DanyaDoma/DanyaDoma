  <text x="54" y="368" class="sans" font-size="15" fill="#98A4B3">Мелкие опыты: вёрстка, анимации и мини-интерфейсы — без сборщиков и фреймворков.</text>
  <text x="946" y="368" text-anchor="end" class="mono" font-size="12" fill="#6E7B8B">github.com/DanyaDoma</text>
