<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="64" viewBox="0 0 1000 64" role="img" aria-labelledby="tickTitle">
  <title id="tickTitle">Бегущая строка: пишу на C#, собираю WPF, проверяю тестами, чиню базы, не верю на слово, документирую</title>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1016"/>
      <stop offset="0.06" stop-color="#0B1016" stop-opacity="0"/>
      <stop offset="0.94" stop-color="#0B1016" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B1016"/>
    </linearGradient>
    <g id="tick">
      <g class="mono" font-size="14" letter-spacing="2.4" fill="#9AA6B5" text-anchor="middle">
        <text x="105" y="39">ПИШУ НА C#</text>
        <text x="315" y="39">СОБИРАЮ WPF</text>
        <text x="525" y="39">ПРОВЕРЯЮ ТЕСТАМИ</text>
        <text x="735" y="39">ЧИНЮ БАЗЫ</text>
        <text x="945" y="39">НЕ ВЕРЮ НА СЛОВО</text>
        <text x="1155" y="39">ДОКУМЕНТИРУЮ</text>
      </g>
      <g fill="#E28A3C">
        <rect x="206" y="30" width="8" height="8" rx="1" transform="rotate(45 210 34)"/>
        <rect x="416" y="30" width="8" height="8" rx="1" transform="rotate(45 420 34)"/>
        <rect x="626" y="30" width="8" height="8" rx="1" transform="rotate(45 630 34)"/>
        <rect x="836" y="30" width="8" height="8" rx="1" transform="rotate(45 840 34)"/>
        <rect x="1046" y="30" width="8" height="8" rx="1" transform="rotate(45 1050 34)"/>
      </g>
    </g>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .track { animation: marquee 26s linear infinite; }
      @keyframes marquee { to { transform: translateX(-1260px); } }
      @media (prefers-reduced-motion: reduce) { .track { animation: none; } }
    </style>
  </defs>

  <rect width="1000" height="64" fill="#0B1016"/>
  <rect y="0.5" width="1000" height="63" fill="none" stroke="#1E2835"/>
  <g class="track">
    <use href="#tick"/>
    <use href="#tick" x="1260"/>
  </g>
  <rect width="1000" height="64" fill="url(#fade)"/>
</svg>
