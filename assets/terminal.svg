      <stop offset="0" stop-color="#0E151E"/>
      <stop offset="1" stop-color="#090D12"/>
    </linearGradient>
    <filter id="tgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.035"/></feComponentTransfer>
    </filter>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .fade { opacity: 0; animation: fade 0.28s ease-out forwards; }
      .cell { opacity: 0; animation: cellIn 0.12s ease-out forwards; }
      .cursor2 { opacity: 0; animation: fade 0.01s 3.5s forwards, blink 1.05s 3.55s steps(2, start) infinite; }
      @keyframes fade { to { opacity: 1; } }
      @keyframes cellIn { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .fade, .cell, .cursor2 { opacity: 1; animation: none; }
      }
    </style>
  </defs>

