<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="termTitle termDesc">
  <title id="termTitle">Журнал сборки: build, test, импорт дампа и запуск</title>
  <desc id="termDesc">Терминал: dotnet build без ошибок, 28 из 28 тестов пройдено, дамп MySQL на 12 таблиц импортирован, WPF-приложение запущено под ролью администратора.</desc>
  <defs>
