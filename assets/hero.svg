<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">DanyaDoma — инженерный журнал</title>
  <desc id="heroDesc">Данила, разработчик. Траектория: AHK в 2019, моды в 2021, C# в 2023, 1C в 2024, WPF и MySQL в 2026. Статус: building.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121A25"/>
      <stop offset="1" stop-color="#0A0F15"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E28A3C" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#E28A3C" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#E28A3C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5BD6A4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#5BD6A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E28A3C" stop-opacity="0.8"/>
      <stop offset="0.75" stop-color="#E28A3C" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#E28A3C" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33404F"/>
      <stop offset="1" stop-color="#E28A3C" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.032"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="softGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .flow { stroke-dasharray: 2 10; animation: flow 10s linear infinite; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .halo { animation: halo 3.2s ease-out infinite; }
      .travel { animation: travel 4.2s ease-in-out infinite alternate; }
      @keyframes flow { to { stroke-dashoffset: -240; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes halo { 0% { r: 8; opacity: 0.45; } 75% { r: 20; opacity: 0; } 100% { r: 20; opacity: 0; } }
      @keyframes travel { from { transform: translateY(0); } to { transform: translateY(176px); } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .cursor, .halo, .travel { animation: none; }
      }
    </style>
  </defs>

  <rect width="1000" height="450" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="450" rx="22" fill="url(#grid)"/>
  <ellipse cx="880" cy="10" rx="390" ry="300" fill="url(#aurora)"/>
  <ellipse cx="40" cy="440" rx="300" ry="220" fill="url(#mintglow)"/>
  <rect width="1000" height="450" rx="22" filter="url(#grain)" opacity="0.45"/>
  <rect x="0.75" y="0.75" width="998.5" height="448.5" rx="21.5" fill="none" stroke="#2B3646" stroke-width="1.5"/>
  <line x1="640" y1="40" x2="640" y2="400" stroke="#1D2733" stroke-width="1"/>

  <!-- mark + eyebrow -->
  <rect x="54" y="42" width="42" height="42" rx="11" fill="#141C26" stroke="#344154"/>
  <text x="75" y="70" text-anchor="middle" class="mono" font-size="18" font-weight="700" fill="#E28A3C">D<tspan fill="#F4F0E8">.</tspan></text>
  <text x="110" y="68" class="mono" font-size="13" letter-spacing="2.2" fill="#E28A3C">ИНЖЕНЕРНЫЙ ЖУРНАЛ · 2019—2026</text>

  <!-- status -->
  <circle cx="858" cy="64" r="7" fill="#5BD6A4" opacity="0.14"/>
  <circle cx="858" cy="64" r="3.4" fill="#5BD6A4"/>
  <text x="948" y="69" text-anchor="end" class="mono" font-size="12" letter-spacing="1.6" fill="#98A4B3">BUILDING</text>

  <!-- name -->
  <text x="54" y="180" class="sans" font-size="96" font-weight="600" letter-spacing="2" fill="#F4F0E8">DANYA</text>
  <text x="54" y="270" class="sans" font-size="96" font-weight="600" letter-spacing="2" fill="#F4F0E8">DOMA</text>
  <circle cx="338" cy="262" r="9" fill="#E28A3C"/>

  <rect x="56" y="292" width="380" height="1.5" fill="url(#rule)"/>
  <text x="56" y="324" class="sans" font-size="21" fill="#CBC6BC">Собираю системы: от AHK-скриптов</text>
  <text x="56" y="352" class="sans" font-size="21" fill="#CBC6BC">до WPF и MySQL.<tspan class="cursor" fill="#E28A3C">▍</tspan></text>

  <!-- chips -->
  <g class="mono" font-size="13" letter-spacing="0.6" fill="#AEB8C6">
    <rect x="56" y="362" width="104" height="28" rx="14" fill="#131A23" stroke="#2C3644"/>
    <text x="108" y="381" text-anchor="middle">C# / .NET</text>
    <rect x="168" y="362" width="60" height="28" rx="14" fill="#131A23" stroke="#2C3644"/>
    <text x="198" y="381" text-anchor="middle">WPF</text>
    <rect x="236" y="362" width="78" height="28" rx="14" fill="#131A23" stroke="#2C3644"/>
    <text x="275" y="381" text-anchor="middle">MySQL</text>
    <rect x="322" y="362" width="54" height="28" rx="14" fill="#131A23" stroke="#2C3644"/>
    <text x="349" y="381" text-anchor="middle">SQL</text>
  </g>

  <!-- trajectory rail -->
  <text x="672" y="112" class="mono" font-size="12" letter-spacing="2.4" fill="#6E7B8B">ТРАЕКТОРИЯ / 001</text>
  <text x="948" y="112" text-anchor="end" class="mono" font-size="12" letter-spacing="1.6" fill="#E28A3C">NOW → 2026</text>

  <line x1="684" y1="152" x2="684" y2="328" stroke="url(#rail)" stroke-width="1.6"/>
  <line x1="684" y1="152" x2="684" y2="328" stroke="#E28A3C" stroke-width="1.6" class="flow" opacity="0.55"/>

  <g stroke="#39465A" stroke-width="1.2" fill="#0D131A">
    <circle cx="684" cy="152" r="4.6"/>
    <circle cx="684" cy="196" r="4.6"/>
    <circle cx="684" cy="240" r="4.6"/>
    <circle cx="684" cy="284" r="4.6"/>
  </g>
  <circle cx="684" cy="328" r="5.2" fill="#0D131A" stroke="#E28A3C" stroke-width="1.6"/>
  <circle cx="684" cy="328" r="2" fill="#E28A3C"/>
  <circle cx="684" cy="328" r="8" fill="none" stroke="#E28A3C" stroke-opacity="0.6" class="halo"/>
  <circle cx="684" cy="152" r="2.6" fill="#E28A3C" filter="url(#softGlow)" class="travel"/>

  <g class="mono" font-size="12.5" fill="#6E7B8B">
    <text x="702" y="157">2019</text>
    <text x="702" y="201">2021</text>
    <text x="702" y="245">2023</text>
    <text x="702" y="289">2024</text>
  </g>
  <text x="702" y="333" class="mono" font-size="12.5" fill="#E28A3C">2026</text>

  <g class="sans" font-size="18" fill="#D5DCE5">
    <text x="758" y="157">AHK-макросы</text>
    <text x="758" y="201">Моды и переводы</text>
    <text x="758" y="245">Первый C#</text>
    <text x="758" y="289">1C и данные</text>
  </g>
  <text x="758" y="333" class="sans" font-size="18" font-weight="600" fill="#F4F0E8">WPF + MySQL</text>

  <!-- footer -->
  <line x1="54" y1="410" x2="946" y2="410" stroke="#1F2834"/>
  <text x="54" y="432" class="mono" font-size="12" letter-spacing="0.5" fill="#7F8A99">github.com/DanyaDoma</text>
  <text x="946" y="432" text-anchor="end" class="mono" font-size="12" letter-spacing="1.4" fill="#7F8A99">PROFILE / 002 <tspan fill="#E28A3C">·</tspan> RU</text>
</svg>
