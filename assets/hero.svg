<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">DanyaDoma — инженерный журнал</title>
  <desc id="heroDesc">Данила, разработчик. Траектория: AHK в 2019, модификации в 2021, код в 2023, данные в 2024, WPF и MySQL в 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121924"/>
      <stop offset="1" stop-color="#0B0F15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0873A" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#E0873A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0873A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E0873A" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .flow { stroke-dasharray: 2 11; animation: flow 12s linear infinite; }
      .cursor { animation: blink 1.1s steps(2, start) infinite; }
      .pulse { animation: pulse 3.4s ease-out infinite; transform-origin: 1070px 160px; }
      @keyframes flow { to { stroke-dashoffset: -260; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0% { r: 10; opacity: 0.55; } 70% { r: 22; opacity: 0; } 100% { r: 22; opacity: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .flow, .cursor, .pulse { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="520" rx="28" fill="url(#grid)"/>
  <ellipse cx="1010" cy="30" rx="430" ry="330" fill="url(#glow)"/>
  <rect width="1200" height="520" rx="28" filter="url(#grain)" opacity="0.5"/>
  <rect x="0.75" y="0.75" width="1198.5" height="518.5" rx="27.5" fill="none" stroke="#2A3442" stroke-width="1.5"/>

  <!-- mark -->
  <rect x="64" y="56" width="46" height="46" rx="12" fill="#141B24" stroke="#334052"/>
  <text x="87" y="86" text-anchor="middle" class="mono" font-size="19" font-weight="700" fill="#E0873A">D<tspan fill="#F3EFE7">.</tspan></text>
  <text x="126" y="85" class="mono" font-size="12" letter-spacing="2.4" fill="#E0873A">ИНЖЕНЕРНЫЙ ЖУРНАЛ · 2019—2026</text>

  <!-- status -->
  <circle cx="985" cy="80" r="8" fill="#5BD1A0" opacity="0.12"/>
  <circle cx="985" cy="80" r="3.5" fill="#5BD1A0"/>
  <text x="999" y="85" class="mono" font-size="11" letter-spacing="1.8" fill="#8C97A6">STATUS: BUILDING</text>

  <!-- name -->
  <text x="70" y="190" class="sans" font-size="104" font-weight="600" letter-spacing="3" fill="#F3EFE7">DANYA</text>
  <text x="70" y="294" class="sans" font-size="104" font-weight="600" letter-spacing="3" fill="#F3EFE7">DOMA</text>
  <circle cx="370" cy="288" r="9" fill="#E0873A"/>

  <rect x="72" y="330" width="500" height="1.5" fill="url(#rule)"/>
  <text x="72" y="370" class="sans" font-size="23" fill="#CFCBC2">Собираю системы: от AHK-скриптов</text>
  <text x="72" y="402" class="sans" font-size="23" fill="#CFCBC2">до WPF и MySQL.<tspan class="cursor" fill="#E0873A">▍</tspan></text>

  <!-- chips -->
  <g class="mono" font-size="12" letter-spacing="1" fill="#AEB8C6">
    <rect x="72" y="430" width="112" height="32" rx="16" fill="#131A23" stroke="#2C3644"/>
    <text x="128" y="451" text-anchor="middle">C# / .NET</text>
    <rect x="196" y="430" width="76" height="32" rx="16" fill="#131A23" stroke="#2C3644"/>
    <text x="234" y="451" text-anchor="middle">WPF</text>
    <rect x="284" y="430" width="98" height="32" rx="16" fill="#131A23" stroke="#2C3644"/>
    <text x="333" y="451" text-anchor="middle">MySQL</text>
    <rect x="394" y="430" width="72" height="32" rx="16" fill="#131A23" stroke="#2C3644"/>
    <text x="430" y="451" text-anchor="middle">SQL</text>
  </g>

  <!-- system map -->
  <text x="690" y="120" class="mono" font-size="11" letter-spacing="3" fill="#6E7A8A">SYSTEM MAP / 01</text>

  <path d="M720 380 C760 365 765 345 800 330 C840 315 845 285 880 272 C915 260 930 240 970 222 C1010 205 1030 180 1070 160"
        fill="none" stroke="#334052" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M720 380 C760 365 765 345 800 330 C840 315 845 285 880 272 C915 260 930 240 970 222 C1010 205 1030 180 1070 160"
        fill="none" stroke="#E0873A" stroke-width="1.5" stroke-linecap="round" class="flow" opacity="0.9"/>

  <g stroke="#3A4757" stroke-width="1">
    <path d="M720 368v24M708 380h24"/>
    <path d="M800 318v24M788 330h24"/>
    <path d="M880 260v24M868 272h24"/>
    <path d="M970 210v24M958 222h24"/>
  </g>
  <g fill="#0F141B" stroke="#8FA0B5" stroke-width="1.2">
    <circle cx="720" cy="380" r="4.5"/>
    <circle cx="800" cy="330" r="4.5"/>
    <circle cx="880" cy="272" r="4.5"/>
    <circle cx="970" cy="222" r="4.5"/>
  </g>
  <g fill="#E0873A">
    <circle cx="720" cy="380" r="1.8"/>
    <circle cx="800" cy="330" r="1.8"/>
    <circle cx="880" cy="272" r="1.8"/>
    <circle cx="970" cy="222" r="1.8"/>
  </g>

  <circle cx="1070" cy="160" r="10" fill="none" stroke="#E0873A" stroke-opacity="0.55" class="pulse"/>
  <circle cx="1070" cy="160" r="15" fill="none" stroke="#E0873A" stroke-opacity="0.22"/>
  <circle cx="1070" cy="160" r="7" fill="#E0873A" filter="url(#softGlow)"/>
  <circle cx="1070" cy="160" r="2.4" fill="#0B0F15"/>

  <g class="mono" text-anchor="middle">
    <text x="720" y="410" font-size="11" fill="#E0873A">2019</text>
    <text x="720" y="432" font-size="15" fill="#C9D1DB">AHK</text>
    <text x="800" y="360" font-size="11" fill="#E0873A">2021</text>
    <text x="800" y="382" font-size="15" fill="#C9D1DB">Моды</text>
    <text x="880" y="302" font-size="11" fill="#E0873A">2023</text>
    <text x="880" y="324" font-size="15" fill="#C9D1DB">Код</text>
    <text x="970" y="252" font-size="11" fill="#E0873A">2024</text>
    <text x="970" y="274" font-size="15" fill="#C9D1DB">Данные</text>
    <text x="1070" y="196" font-size="11" fill="#E0873A">2026</text>
    <text x="1070" y="218" font-size="14" fill="#F3EFE7">WPF</text>
  </g>

  <rect x="1040" y="116" width="60" height="20" rx="10" fill="#2A1B0E" stroke="#7A4A1E"/>
  <text x="1070" y="130" text-anchor="middle" class="mono" font-size="9" letter-spacing="1.5" fill="#F0A35E">NOW</text>

  <text x="1128" y="446" text-anchor="end" class="mono" font-size="11" letter-spacing="1.6" fill="#5F6B7A">2019 → 2026</text>

  <!-- footer -->
  <rect x="64" y="470" width="1072" height="1" fill="#1F2834"/>
  <text x="64" y="494" class="mono" font-size="12" letter-spacing="0.6" fill="#7F8A99">github.com/DanyaDoma</text>
  <text x="1136" y="494" text-anchor="end" class="mono" font-size="12" letter-spacing="1.6" fill="#7F8A99">PROFILE / 001 <tspan fill="#E0873A">·</tspan> 2026</text>
</svg>
