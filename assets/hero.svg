<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
<title id="title">Danila — разработчик и охотник за багами</title>
<desc id="desc">Пишу код. Ловлю баги. Иногда наоборот. Статус: онлайн.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101829"/><stop offset="1" stop-color="#080B16"/></linearGradient>
  <radialGradient id="cyanGlow"><stop stop-color="#67E8F9" stop-opacity=".15"/><stop offset="1" stop-color="#67E8F9" stop-opacity="0"/></radialGradient>
  <radialGradient id="violetGlow"><stop stop-color="#A78BFA" stop-opacity=".16"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#8B9BB8" stroke-opacity=".035"/></pattern>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F2F6FF"/><stop offset=".72" stop-color="#F2F6FF"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
  <linearGradient id="platform" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .sans{font-family:Bahnschrift,'Segoe UI',sans-serif}.mono{font-family:'Cascadia Code',Consolas,monospace}
    .bug-a{animation:hover 2.4s ease-in-out infinite}.bug-b{animation:hover 2.4s ease-in-out -1.2s infinite}.cursor{animation:blink 1.1s steps(2,start) infinite}.dash{animation:dash 8s linear infinite}.pulse{animation:pulse 2.2s ease-out infinite}
    @keyframes hover{50%{transform:translateY(-8px)}}@keyframes blink{50%{opacity:0}}@keyframes dash{to{stroke-dashoffset:-120}}@keyframes pulse{0%{r:5;opacity:.5}80%,100%{r:13;opacity:0}}
    @media(prefers-reduced-motion:reduce){.bug-a,.bug-b,.cursor,.dash,.pulse{animation:none}}
  </style>
</defs>
<rect width="1000" height="350" rx="24" fill="url(#bg)"/>
<rect width="1000" height="350" rx="24" fill="url(#grid)"/>
<ellipse cx="78" cy="332" rx="350" ry="240" fill="url(#cyanGlow)"/>
<ellipse cx="900" cy="28" rx="330" ry="260" fill="url(#violetGlow)"/>
<rect x=".75" y=".75" width="998.5" height="348.5" rx="23.25" fill="none" stroke="#22314A" stroke-width="1.5"/>
<path d="M40 58V40h18M942 40h18v18M40 292v18h18M942 310h18v-18" fill="none" stroke="#344966" stroke-width="1.5"/>
<g class="mono" font-size="12" letter-spacing="2">
  <text x="64" y="68" fill="#67E8F9">PLAYER PROFILE / 01</text>
  <text x="936" y="68" text-anchor="end" fill="#8B9BB8">STATUS: <tspan fill="#67E8F9">ONLINE</tspan></text>
</g>
<circle cx="775" cy="64" r="5" fill="none" stroke="#67E8F9" class="pulse"/>
<circle cx="775" cy="64" r="3" fill="#67E8F9"/>
<text x="58" y="174" class="sans" font-size="96" font-weight="600" letter-spacing="-2" fill="url(#name)">Danila</text>
<rect x="63" y="194" width="46" height="4" rx="2" fill="#67E8F9"/>
<rect x="115" y="194" width="20" height="4" rx="2" fill="#A78BFA"/>
<text x="62" y="239" class="sans" font-size="25" fill="#C8D4E8">Пишу код. Ловлю баги. Иногда наоборот.<tspan class="cursor" fill="#67E8F9">▍</tspan></text>
<g class="mono" font-size="12" letter-spacing="1.4">
  <rect x="62" y="272" width="178" height="32" rx="16" fill="#0D1626" stroke="#223E55"/><text x="151" y="293" text-anchor="middle" fill="#9EEAF4">CODE / PLAY / REPEAT</text>
  <rect x="250" y="272" width="164" height="32" rx="16" fill="#15152A" stroke="#39345C"/><text x="332" y="293" text-anchor="middle" fill="#C4B5FD">BUGS: 0 (ПОЧТИ)</text>
</g>
<g>
  <rect x="688" y="88" width="248" height="216" rx="18" fill="#0A1020" fill-opacity=".82" stroke="#293B58"/>
  <text x="710" y="114" class="mono" font-size="11" letter-spacing="1.8" fill="#8B9BB8">CURRENT QUEST</text>
  <text x="710" y="139" class="sans" font-size="17" fill="#F2F6FF">Поймать баг до релиза</text>
  <path d="M710 248H914" stroke="#1D2D45" stroke-width="2"/>
  <path d="M710 248H914" stroke="url(#platform)" stroke-width="2" stroke-dasharray="3 9" class="dash"/>
  <path d="M730 253h166l-12 7H742z" fill="#121F33"/>
  <g transform="translate(780 168) scale(3)" shape-rendering="crispEdges">
    <rect x="4" y="0" width="8" height="2" fill="#25304A"/><rect x="2" y="2" width="11" height="3" fill="#25304A"/><rect x="3" y="5" width="9" height="5" fill="#FFB86B"/>
    <rect x="10" y="5" width="2" height="2" fill="#F2F6FF"/><rect x="11" y="6" width="1" height="1" fill="#172036"/>
    <rect x="2" y="10" width="11" height="6" fill="#6264D9"/><rect x="4" y="10" width="7" height="2" fill="#A78BFA"/><rect x="0" y="11" width="3" height="5" fill="#A78BFA"/>
    <rect x="3" y="16" width="4" height="5" fill="#25304A"/><rect x="9" y="16" width="4" height="5" fill="#25304A"/><rect x="1" y="20" width="6" height="2" fill="#67E8F9"/><rect x="9" y="20" width="6" height="2" fill="#67E8F9"/>
    <path d="M13 11h5v-5" fill="none" stroke="#FFB86B" stroke-width="2"/><rect x="16" y="1" width="7" height="7" fill="none" stroke="#67E8F9" stroke-width="1"/><path d="M17 2l5 5M22 2l-5 5" stroke="#67E8F9" stroke-width=".6" opacity=".65"/>
  </g>
  <g class="bug-a" transform="translate(874 165)" shape-rendering="crispEdges">
    <rect x="4" y="0" width="2" height="2" fill="#FF7AD9"/><rect x="14" y="0" width="2" height="2" fill="#FF7AD9"/><rect x="2" y="2" width="4" height="4" fill="#A78BFA"/><rect x="14" y="2" width="4" height="4" fill="#A78BFA"/>
    <rect x="5" y="3" width="10" height="12" rx="3" fill="#FF7AD9" filter="url(#glow)"/><rect x="7" y="6" width="2" height="2" fill="#080B16"/><rect x="12" y="6" width="2" height="2" fill="#080B16"/>
    <path d="M5 9H0M15 9h5M5 13H1M15 13h4" stroke="#FF7AD9" stroke-width="2"/>
  </g>
  <g class="bug-b" transform="translate(894 198) scale(.7)" shape-rendering="crispEdges" opacity=".8">
    <rect x="4" y="0" width="2" height="2" fill="#67E8F9"/><rect x="14" y="0" width="2" height="2" fill="#67E8F9"/><rect x="2" y="2" width="4" height="4" fill="#67E8F9"/><rect x="14" y="2" width="4" height="4" fill="#67E8F9"/><rect x="5" y="3" width="10" height="12" rx="3" fill="#22D3EE"/><path d="M5 9H0M15 9h5M5 13H1M15 13h4" stroke="#67E8F9" stroke-width="2"/>
  </g>
  <text x="710" y="283" class="mono" font-size="11" fill="#637693">REWARD</text><text x="914" y="283" text-anchor="end" class="mono" font-size="11" fill="#FFB86B">+1 WORKING BUILD</text>
</g>
</svg>
