<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="stackTitle stackDesc">
  <title id="stackTitle">Стек: рабочий набор инструментов</title>
  <desc id="stackDesc">C#, .NET и WPF, MySQL, SQL, PostgreSQL, Python, JavaScript, C++, PHP, 1C, Git, AHK. Не рейтинг, а инструменты, которыми я работал.</desc>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111925"/>
      <stop offset="1" stop-color="#0A0F15"/>
    </linearGradient>
    <radialGradient id="sglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E28A3C" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#E28A3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="sgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="430" rx="20" fill="url(#sbg)"/>
  <ellipse cx="940" cy="420" rx="320" ry="200" fill="url(#sglow)"/>
  <rect width="1000" height="430" rx="20" filter="url(#sgrain)" opacity="0.4"/>
  <rect x="0.75" y="0.75" width="998.5" height="428.5" rx="19.5" fill="none" stroke="#293443" stroke-width="1.5"/>

  <text x="54" y="46" class="mono" font-size="12" letter-spacing="2.4" fill="#6E7B8B">СТЕК / РАБОЧИЙ НАБОР</text>
  <text x="946" y="46" text-anchor="end" class="mono" font-size="11.5" letter-spacing="1.4" fill="#6E7B8B">НЕ РЕЙТИНГ</text>
  <line x1="54" y1="62" x2="946" y2="62" stroke="#1F2936"/>

  <line x1="500" y1="84" x2="500" y2="352" stroke="#1D2733"/>

  <g class="sans" font-size="20" fill="#E7E2D9">
    <text x="76" y="107">C#</text>
    <text x="76" y="155">.NET + WPF</text>
    <text x="76" y="203">MySQL</text>
    <text x="76" y="251">SQL</text>
    <text x="76" y="299">PostgreSQL</text>
    <text x="76" y="347">Python</text>

    <text x="526" y="107">JavaScript</text>
    <text x="526" y="155">C++</text>
    <text x="526" y="203">PHP</text>
    <text x="526" y="251">1C</text>
    <text x="526" y="299">Git</text>
    <text x="526" y="347">AHK</text>
  </g>

  <g class="mono" font-size="13" fill="#7F8A99" text-anchor="end">
    <text x="476" y="107">рабочий язык</text>
    <text x="476" y="155">десктоп</text>
    <text x="476" y="203">основная база</text>
    <text x="476" y="251">запросы и схема</text>
    <text x="476" y="299">вторая база</text>
    <text x="476" y="347">автоматизация</text>

    <text x="926" y="107">фронт-опыты</text>
    <text x="926" y="155">алгоритмы</text>
    <text x="926" y="203">легаси-задачи</text>
    <text x="926" y="251">учёт и данные</text>
    <text x="926" y="299">версии и история</text>
    <text x="926" y="347">с этого начал</text>
  </g>

  <g>
    <rect x="54" y="100" width="7" height="7" rx="1" transform="rotate(45 57.5 103.5)" fill="#E28A3C"/>
    <rect x="54" y="148" width="7" height="7" rx="1" transform="rotate(45 57.5 151.5)" fill="#E28A3C"/>
    <rect x="54" y="196" width="7" height="7" rx="1" transform="rotate(45 57.5 199.5)" fill="#E28A3C"/>
    <rect x="54" y="244" width="7" height="7" rx="1" transform="rotate(45 57.5 247.5)" fill="#3B4A5E"/>
    <rect x="54" y="292" width="7" height="7" rx="1" transform="rotate(45 57.5 295.5)" fill="#3B4A5E"/>
    <rect x="54" y="340" width="7" height="7" rx="1" transform="rotate(45 57.5 343.5)" fill="#3B4A5E"/>

    <rect x="504" y="100" width="7" height="7" rx="1" transform="rotate(45 507.5 103.5)" fill="#3B4A5E"/>
    <rect x="504" y="148" width="7" height="7" rx="1" transform="rotate(45 507.5 151.5)" fill="#3B4A5E"/>
    <rect x="504" y="196" width="7" height="7" rx="1" transform="rotate(45 507.5 199.5)" fill="#3B4A5E"/>
    <rect x="504" y="244" width="7" height="7" rx="1" transform="rotate(45 507.5 247.5)" fill="#3B4A5E"/>
    <rect x="504" y="292" width="7" height="7" rx="1" transform="rotate(45 507.5 295.5)" fill="#3B4A5E"/>
    <rect x="504" y="340" width="7" height="7" rx="1" transform="rotate(45 507.5 343.5)" fill="#3B4A5E"/>
  </g>

  <line x1="54" y1="378" x2="946" y2="378" stroke="#1F2936"/>
  <text x="54" y="406" class="sans" font-size="15" fill="#98A4B3">Не рейтинг, а набор инструментов, которые я трогал руками.</text>
  <text x="946" y="406" text-anchor="end" class="mono" font-size="11.5" fill="#6E7B8B">12 ПОЗИЦИЙ</text>
</svg>
