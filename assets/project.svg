<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="projTitle projDesc">
  <title id="projTitle">Избранное: ООО «Обувь» — система учёта заказов</title>
  <desc id="projDesc">Проект на C#, WPF и MySQL: 12 таблиц, 28 тестов, задания 1–4 демонстрационного экзамена. Миниатюра окна с таблицей товаров, скидками и остатками.</desc>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121A25"/>
      <stop offset="1" stop-color="#0A0F15"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151E2A"/>
      <stop offset="1" stop-color="#0E151E"/>
    </linearGradient>
    <linearGradient id="prule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E28A3C" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#E28A3C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E28A3C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E28A3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="pgrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="470" rx="20" fill="url(#pbg)"/>
  <ellipse cx="820" cy="60" rx="360" ry="240" fill="url(#pglow)"/>
  <rect width="1000" height="470" rx="20" filter="url(#pgrain)" opacity="0.4"/>
  <rect x="0.75" y="0.75" width="998.5" height="468.5" rx="19.5" fill="none" stroke="#293443" stroke-width="1.5"/>

  <!-- header -->
  <text x="52" y="46" class="mono" font-size="12" letter-spacing="2.4" fill="#6E7B8B">ИЗБРАННОЕ / 01</text>
  <rect x="790" y="27" width="158" height="26" rx="13" fill="#102A22" stroke="#2A5A47"/>
  <circle cx="805" cy="40" r="3.2" fill="#5BD6A4"/>
  <text x="816" y="45" class="mono" font-size="11" letter-spacing="1" fill="#7FE3BA">ЗАДАНИЯ 1–4 · СДАНО</text>
  <line x1="52" y1="64" x2="948" y2="64" stroke="#1F2936"/>

  <!-- left -->
  <text x="52" y="134" class="sans" font-size="42" font-weight="600" letter-spacing="0.4" fill="#F4F0E8">ООО «Обувь»</text>
  <text x="52" y="164" class="sans" font-size="18" fill="#98A4B3">Система учёта заказов и остатков</text>
  <rect x="54" y="184" width="300" height="1.5" fill="url(#prule)"/>

  <g class="mono" font-size="14" fill="#AEB8C6">
    <text x="52" y="216">C# · WPF · .NET 10</text>
    <text x="52" y="244">MySQL 8 · схема и дамп</text>
    <text x="52" y="272">роли, фильтры, CRUD</text>
  </g>

  <g>
    <text x="52" y="342" class="sans" font-size="30" font-weight="600" fill="#E28A3C">12</text>
    <text x="52" y="362" class="mono" font-size="11" letter-spacing="1.4" fill="#6E7B8B">ТАБЛИЦ</text>
    <text x="148" y="342" class="sans" font-size="30" font-weight="600" fill="#E28A3C">28</text>
    <text x="148" y="362" class="mono" font-size="11" letter-spacing="1.4" fill="#6E7B8B">ТЕСТОВ</text>
    <text x="244" y="342" class="sans" font-size="30" font-weight="600" fill="#E28A3C">4</text>
    <text x="244" y="362" class="mono" font-size="11" letter-spacing="1.4" fill="#6E7B8B">ЗАДАНИЯ</text>
  </g>

  <text x="52" y="418" class="sans" font-size="18" font-weight="600" fill="#E28A3C">открыть репозиторий →</text>
  <line x1="54" y1="432" x2="252" y2="432" stroke="#7A4A1E"/>

  <!-- window -->
  <rect x="440" y="84" width="508" height="356" rx="12" fill="url(#win)" stroke="#2E3B4C"/>
  <rect x="440.5" y="84.5" width="507" height="35" rx="11.5" fill="#18222E"/>
  <line x1="440" y1="120" x2="948" y2="120" stroke="#2A3644"/>
  <g fill="#465366">
    <circle cx="458" cy="102" r="4"/>
    <circle cx="474" cy="102" r="4"/>
    <circle cx="490" cy="102" r="4"/>
  </g>
  <text x="694" y="107" text-anchor="middle" class="mono" font-size="12" fill="#8C99A9">ООО «Обувь» — панель администратора</text>
  <rect x="896" y="92" width="40" height="20" rx="10" fill="#102A22" stroke="#2A5A47"/>
  <text x="916" y="106" text-anchor="middle" class="mono" font-size="9.5" fill="#7FE3BA">ADMIN</text>

  <!-- tabs -->
  <g class="sans" font-size="13">
    <text x="458" y="142" fill="#7F8A99">Заказы</text>
    <text x="528" y="142" fill="#F4F0E8">Товары</text>
    <text x="602" y="142" fill="#7F8A99">Пользователи</text>
  </g>
  <line x1="528" y1="150" x2="578" y2="150" stroke="#E28A3C" stroke-width="2"/>

  <!-- filters -->
  <g class="mono" font-size="10.5">
    <rect x="458" y="163" width="12" height="12" rx="3" fill="#241A10" stroke="#7A4A1E"/>
    <path d="M460.5 169l2 2.4 4-5" fill="none" stroke="#F0A35E" stroke-width="1.6"/>
    <text x="476" y="173" fill="#F0A35E">только со скидкой</text>
  </g>
  <rect x="700" y="160" width="236" height="22" rx="11" fill="#0D141C" stroke="#2C3746"/>
  <circle cx="714" cy="171" r="4" fill="none" stroke="#5A6779"/>
  <line x1="717" y1="174" x2="720" y2="177" stroke="#5A6779"/>
  <text x="728" y="175" class="mono" font-size="10.5" fill="#5A6779">поиск по наименованию…</text>

  <!-- table head -->
  <rect x="450" y="190" width="488" height="24" fill="#111925"/>
  <g class="mono" font-size="9.5" letter-spacing="1" fill="#6E7B8B">
    <text x="462" y="206">НАИМЕНОВАНИЕ</text>
    <text x="690" y="206">ЦЕНА, ₽</text>
    <text x="772" y="206">СКИДКА</text>
    <text x="862" y="206">ОСТАТОК</text>
  </g>

  <!-- rows -->
  <g class="sans" font-size="13">
    <rect x="450" y="214" width="488" height="35" fill="#131C27"/>
    <text x="462" y="236" fill="#DDE3EA">Ботинки · A112T4</text>
    <text x="690" y="236" fill="#C9D2DC">4 990</text>
    <text x="772" y="236" fill="#F0A35E">3%</text>
    <text x="862" y="236" fill="#C9D2DC">6</text>

    <text x="462" y="271" fill="#C9D2DC">Ботинки · F635R4</text>
    <text x="690" y="271" fill="#C9D2DC">3 244</text>
    <text x="772" y="271" fill="#F0A35E">2%</text>
    <text x="862" y="271" fill="#C9D2DC">13</text>

    <text x="462" y="306" fill="#C9D2DC">Туфли · H782T5</text>
    <text x="690" y="306" fill="#C9D2DC">4 499</text>
    <text x="772" y="306" fill="#F0A35E">4%</text>
    <text x="862" y="306" fill="#C9D2DC">5</text>

    <text x="462" y="341" fill="#C9D2DC">Кеды · S634B5</text>
    <text x="690" y="341" fill="#C9D2DC">5 500</text>
    <text x="772" y="341" fill="#F0A35E">3%</text>
    <text x="862" y="341" fill="#FF7A6B">0</text>

    <text x="462" y="376" fill="#C9D2DC">Полуботинки · J384T6</text>
    <text x="690" y="376" fill="#C9D2DC">3 800</text>
    <text x="772" y="376" fill="#F0A35E">2%</text>
    <text x="862" y="376" fill="#C9D2DC">16</text>
  </g>
  <line x1="450" y1="249" x2="938" y2="249" stroke="#1B2531"/>
  <line x1="450" y1="284" x2="938" y2="284" stroke="#1B2531"/>
  <line x1="450" y1="319" x2="938" y2="319" stroke="#1B2531"/>
  <line x1="450" y1="354" x2="938" y2="354" stroke="#1B2531"/>

  <!-- status bar -->
  <rect x="440.5" y="386.5" width="507" height="53" fill="#0F1721"/>
  <line x1="440" y1="387" x2="948" y2="387" stroke="#2A3644"/>
  <circle cx="462" cy="406" r="3.2" fill="#5BD6A4"/>
  <text x="474" y="410" class="mono" font-size="10.5" fill="#7FE3BA">28 / 28 ТЕСТОВ ПРОЙДЕНО</text>
  <text x="938" y="410" text-anchor="end" class="mono" font-size="10.5" fill="#6E7B8B">MySQL · localhost</text>
  <rect x="458" y="421" width="480" height="4" rx="2" fill="#1C2733"/>
  <rect x="458" y="421" width="480" height="4" rx="2" fill="#5BD6A4" opacity="0.75"/>
</svg>
