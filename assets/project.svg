<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="projTitle projDesc">
  <title id="projTitle">ООО «Обувь» — избранный проект</title>
  <desc id="projDesc">Информационная система учёта заказов: WPF, .NET 10, MySQL 8, 12 таблиц, 28 тестов, задания 1–4 демонстрационного экзамена.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121924"/>
      <stop offset="1" stop-color="#0B0F15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0873A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E0873A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

