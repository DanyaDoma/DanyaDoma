<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="pathTitle pathDesc">
  <title id="pathTitle">Путь: с 2019 по 2026 год</title>
  <desc id="pathDesc">AHK в 2019, моды в 2021, первый код в 2022, C# в 2023, 1C в 2024, Практикум в 2025, WPF и MySQL в 2026.</desc>
  <defs>
    <linearGradient id="tlbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111925"/>
      <stop offset="1" stop-color="#0A0F15"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33404F"/>
      <stop offset="0.75" stop-color="#7A4A1E"/>
      <stop offset="1" stop-color="#E28A3C"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E28A3C" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E28A3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="tgrain2" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.04"/></feComponentTransfer>
    </filter>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .flowline { stroke-dasharray: 2 10; animation: flow 9s linear infinite; }
      .runner { animation: run 9s ease-in-out infinite alternate; }
      .halo { animation: halo 3s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes flow { to { stroke-dashoffset: -240; } }
      @keyframes run { from { transform: translateX(0); } to { transform: translateX(820px); } }
      @keyframes halo { 0% { r: 6; opacity: 0.5; } 80% { r: 16; opacity: 0; } 100% { r: 16; opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .flowline, .runner, .halo { animation: none; } }
    </style>
  </defs>

  <rect width="1000" height="400" rx="20" fill="url(#tlbg)"/>
  <ellipse cx="910" cy="230" rx="300" ry="180" fill="url(#tglow)"/>
  <rect width="1000" height="400" rx="20" filter="url(#tgrain2)" opacity="0.4"/>
  <rect x="0.75" y="0.75" width="998.5" height="398.5" rx="19.5" fill="none" stroke="#293443" stroke-width="1.5"/>

  <text x="54" y="46" class="mono" font-size="12" letter-spacing="2.4" fill="#6E7B8B">ПУТЬ / 2019 → 2026</text>
  <text x="946" y="46" text-anchor="end" class="mono" font-size="11.5" letter-spacing="1.4" fill="#6E7B8B">НЕ В МАСШТАБЕ</text>
  <line x1="54" y1="62" x2="946" y2="62" stroke="#1F2936"/>

  <line x1="90" y1="230" x2="910" y2="230" stroke="url(#line)" stroke-width="2"/>
  <line x1="90" y1="230" x2="910" y2="230" stroke="#E28A3C" stroke-width="2" class="flowline" opacity="0.5"/>

  <!-- nodes -->
  <g fill="#0D131A" stroke="#46566B" stroke-width="1.5">
    <circle cx="90" cy="230" r="5.5"/>
    <circle cx="227" cy="230" r="5.5"/>
    <circle cx="363" cy="230" r="5.5"/>
    <circle cx="500" cy="230" r="5.5"/>
    <circle cx="637" cy="230" r="5.5"/>
    <circle cx="773" cy="230" r="5.5"/>
  </g>
  <g fill="#E28A3C" opacity="0.85">
    <circle cx="90" cy="230" r="2"/>
    <circle cx="227" cy="230" r="2"/>
    <circle cx="363" cy="230" r="2"/>
    <circle cx="500" cy="230" r="2"/>
    <circle cx="637" cy="230" r="2"/>
    <circle cx="773" cy="230" r="2"/>
  </g>
  <circle cx="910" cy="230" r="7" fill="#E28A3C" filter="url(#dotGlow)"/>
  <circle cx="910" cy="230" r="3" fill="#0A0F15"/>
  <circle cx="910" cy="230" r="10" fill="none" stroke="#E28A3C" stroke-opacity="0.55" class="halo"/>

  <circle cx="90" cy="230" r="3.5" fill="#F6B475" class="runner"/>

  <!-- above labels -->
  <g text-anchor="middle">
    <text x="90" y="158" class="mono" font-size="13" fill="#E28A3C">2019</text>
    <text x="90" y="182" class="sans" font-size="17" fill="#E7E2D9">AHK</text>
    <text x="90" y="202" class="mono" font-size="11" fill="#6E7B8B">макросы</text>

    <text x="363" y="158" class="mono" font-size="13" fill="#E28A3C">2022</text>
    <text x="363" y="182" class="sans" font-size="17" fill="#E7E2D9">Первый код</text>
    <text x="363" y="202" class="mono" font-size="11" fill="#6E7B8B">Python, JS</text>

    <text x="637" y="158" class="mono" font-size="13" fill="#E28A3C">2024</text>
    <text x="637" y="182" class="sans" font-size="17" fill="#E7E2D9">1C</text>
    <text x="637" y="202" class="mono" font-size="11" fill="#6E7B8B">данные</text>

    <text x="910" y="158" class="mono" font-size="13" fill="#E28A3C">2026</text>
    <text x="910" y="182" class="sans" font-size="17" font-weight="600" fill="#F4F0E8">WPF + MySQL</text>
    <text x="910" y="202" class="mono" font-size="11" fill="#7FE3BA">сейчас</text>
  </g>

  <!-- below labels -->
  <g text-anchor="middle">
    <text x="227" y="260" class="mono" font-size="13" fill="#E28A3C">2021</text>
    <text x="227" y="284" class="sans" font-size="17" fill="#E7E2D9">Моды</text>
    <text x="227" y="304" class="mono" font-size="11" fill="#6E7B8B">переводы</text>

    <text x="500" y="260" class="mono" font-size="13" fill="#E28A3C">2023</text>
    <text x="500" y="284" class="sans" font-size="17" fill="#E7E2D9">C#</text>
    <text x="500" y="304" class="mono" font-size="11" fill="#6E7B8B">язык</text>

    <text x="773" y="260" class="mono" font-size="13" fill="#E28A3C">2025</text>
    <text x="773" y="284" class="sans" font-size="17" fill="#E7E2D9">Практикум</text>
    <text x="773" y="304" class="mono" font-size="11" fill="#6E7B8B">учёба</text>
  </g>

  <line x1="54" y1="350" x2="946" y2="350" stroke="#1F2936"/>
  <text x="54" y="378" class="sans" font-size="15" fill="#98A4B3">Каждый шаг — новый инструмент, а не новая профессия.</text>
  <text x="946" y="378" text-anchor="end" class="mono" font-size="11.5" fill="#6E7B8B">7 ОСТАНОВОК</text>
</svg>
