<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="pathTitle pathDesc">
  <title id="pathTitle">Путь с 2019 по 2026</title>
  <desc id="pathDesc">AHK в 2019, моды в 2021, код в 2022, C# в 2023, 1C в 2024, Практикум в 2025, WPF и MySQL в 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121924"/>
      <stop offset="1" stop-color="#0C1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0873A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E0873A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.025"/>
    </pattern>
    <filter id="soft" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .travel { animation: fade 18s ease-in-out infinite; }
      @keyframes fade { 0%, 92% { opacity: 1; } 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .travel { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)"/>
  <ellipse cx="1080" cy="220" rx="300" ry="180" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="398.5" rx="23.5" fill="none" stroke="#2A3442" stroke-width="1.5"/>

  <text x="48" y="48" class="mono" font-size="11" letter-spacing="2.4" fill="#E0873A">ХРОНОЛОГИЯ / 02</text>
  <text x="1152" y="48" text-anchor="end" class="mono" font-size="11" fill="#5F6B7A">не в масштабе</text>

  <!-- axis -->
  <line x1="100" y1="220" x2="1100" y2="220" stroke="#334052" stroke-width="1.4"/>
  <line x1="100" y1="220" x2="1100" y2="220" stroke="#E0873A" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="2 12"/>

  <!-- ticks -->
  <g stroke="#3A4757" stroke-width="1">
    <line x1="100" y1="214" x2="100" y2="226"/>
    <line x1="267" y1="214" x2="267" y2="226"/>
    <line x1="433" y1="214" x2="433" y2="226"/>
    <line x1="600" y1="214" x2="600" y2="226"/>
    <line x1="767" y1="214" x2="767" y2="226"/>
    <line x1="933" y1="214" x2="933" y2="226"/>
    <line x1="1100" y1="214" x2="1100" y2="226"/>
  </g>

  <!-- nodes -->
  <g fill="#0F141B" stroke="#8FA0B5" stroke-width="1.2">
    <circle cx="100" cy="220" r="4.5"/>
    <circle cx="267" cy="220" r="4.5"/>
    <circle cx="433" cy="220" r="4.5"/>
    <circle cx="600" cy="220" r="4.5"/>
    <circle cx="767" cy="220" r="4.5"/>
    <circle cx="933" cy="220" r="4.5"/>
  </g>
  <g fill="#E0873A">
    <circle cx="100" cy="220" r="1.8"/>
    <circle cx="267" cy="220" r="1.8"/>
    <circle cx="433" cy="220" r="1.8"/>
    <circle cx="600" cy="220" r="1.8"/>
    <circle cx="767" cy="220" r="1.8"/>
    <circle cx="933" cy="220" r="1.8"/>
  </g>
  <circle cx="1100" cy="220" r="16" fill="none" stroke="#E0873A" stroke-opacity="0.22"/>
  <circle cx="1100" cy="220" r="7" fill="#E0873A" filter="url(#soft)"/>
  <circle cx="1100" cy="220" r="2.4" fill="#0B0F15"/>

  <circle cx="100" cy="220" r="3" fill="#F0A35E" filter="url(#soft)" class="travel">
    <animateMotion dur="18s" repeatCount="indefinite" path="M100 220 H1100"/>
  </circle>

  <!-- 2019 below -->
  <g text-anchor="middle">
    <text x="100" y="250" class="mono" font-size="11" fill="#E0873A">2019</text>
    <text x="100" y="274" class="sans" font-size="16" fill="#F3EFE7">AHK</text>
    <text x="100" y="296" class="sans" font-size="13" fill="#8A95A4">макросы и софт</text>
  </g>
  <!-- 2021 above -->
  <g text-anchor="middle">
    <text x="267" y="152" class="mono" font-size="11" fill="#E0873A">2021</text>
    <text x="267" y="176" class="sans" font-size="16" fill="#F3EFE7">Моды</text>
    <text x="267" y="198" class="sans" font-size="13" fill="#8A95A4">локализация игр</text>
  </g>
  <!-- 2022 below -->
  <g text-anchor="middle">
    <text x="433" y="250" class="mono" font-size="11" fill="#E0873A">2022</text>
    <text x="433" y="274" class="sans" font-size="16" fill="#F3EFE7">Код</text>
    <text x="433" y="296" class="sans" font-size="13" fill="#8A95A4">Python → веб</text>
  </g>
  <!-- 2023 above -->
  <g text-anchor="middle">
    <text x="600" y="152" class="mono" font-size="11" fill="#E0873A">2023</text>
    <text x="600" y="176" class="sans" font-size="16" fill="#F3EFE7">C#</text>
    <text x="600" y="198" class="sans" font-size="13" fill="#8A95A4">SQL, JS, C++</text>
  </g>
  <!-- 2024 below -->
  <g text-anchor="middle">
    <text x="767" y="250" class="mono" font-size="11" fill="#E0873A">2024</text>
    <text x="767" y="274" class="sans" font-size="16" fill="#F3EFE7">1C</text>
    <text x="767" y="296" class="sans" font-size="13" fill="#8A95A4">учёт и интеграции</text>
  </g>
  <!-- 2025 above -->
  <g text-anchor="middle">
    <text x="933" y="152" class="mono" font-size="11" fill="#E0873A">2025</text>
    <text x="933" y="176" class="sans" font-size="16" fill="#F3EFE7">Яндекс Практикум</text>
    <text x="933" y="198" class="sans" font-size="13" fill="#8A95A4">митапы, комьюнити</text>
  </g>
  <!-- 2026 below -->
  <g text-anchor="middle">
    <text x="1100" y="250" class="mono" font-size="11" fill="#E0873A">2026</text>
    <text x="1100" y="274" class="sans" font-size="16" fill="#F3EFE7">WPF + MySQL</text>
    <text x="1100" y="296" class="sans" font-size="13" fill="#9AA5B4">сейчас · ООО «Обувь»</text>
  </g>

  <!-- legend -->
  <circle cx="1004" cy="356" r="3.2" fill="#E0873A"/>
  <text x="1016" y="360" class="mono" font-size="10" fill="#6E7A8A">этап</text>
  <line x1="1054" y1="356" x2="1078" y2="356" stroke="#E0873A" stroke-width="1.2" stroke-dasharray="2 8"/>
  <text x="1090" y="360" class="mono" font-size="10" fill="#6E7A8A">траектория</text>
</svg>
