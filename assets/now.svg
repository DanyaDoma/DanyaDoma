<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="nowTitle nowDesc">
  <title id="nowTitle">Сейчас: ООО «Обувь», фокус на C# и данных, вне кода — моды и стратегии</title>
  <desc id="nowDesc">Три колонки: текущий проект, фокус и увлечения. Обновлено в октябре 2026.</desc>
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111925"/>
      <stop offset="1" stop-color="#0A0F15"/>
    </linearGradient>
    <radialGradient id="nglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E28A3C" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E28A3C" stop-opacity="0"/>
    </radialGradient>
    <filter id="ngrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.045"/></feComponentTransfer>
    </filter>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1000" height="250" rx="20" fill="url(#nbg)"/>
  <ellipse cx="500" cy="0" rx="420" ry="180" fill="url(#nglow)" opacity="0.5"/>
  <rect width="1000" height="250" rx="20" filter="url(#ngrain)" opacity="0.4"/>
  <rect x="0.75" y="0.75" width="998.5" height="248.5" rx="19.5" fill="none" stroke="#293443" stroke-width="1.5"/>

  <text x="40" y="42" class="mono" font-size="12" letter-spacing="2.4" fill="#6E7B8B">ТЕКУЩИЙ ФОКУС</text>
  <text x="960" y="42" text-anchor="end" class="mono" font-size="11.5" letter-spacing="1.4" fill="#6E7B8B">ОБНОВЛЕНО · ОКТЯБРЬ 2026</text>
  <line x1="40" y1="58" x2="960" y2="58" stroke="#1F2936"/>

  <line x1="360" y1="82" x2="360" y2="216" stroke="#1D2733"/>
  <line x1="680" y1="82" x2="680" y2="216" stroke="#1D2733"/>

  <!-- col 1 -->
  <g>
    <rect x="40" y="86" width="7" height="7" rx="1" transform="rotate(45 43.5 89.5)" fill="#E28A3C"/>
    <text x="58" y="96" class="mono" font-size="12" letter-spacing="2" fill="#E28A3C">СЕЙЧАС</text>
    <text x="40" y="134" class="sans" font-size="26" font-weight="600" fill="#F4F0E8">ООО «Обувь»</text>
    <text x="40" y="162" class="sans" font-size="16.5" fill="#98A4B3">Учёт заказов на WPF,</text>
    <text x="40" y="184" class="sans" font-size="16.5" fill="#98A4B3">.NET 10 и MySQL 8.</text>
    <rect x="40" y="198" width="150" height="26" rx="13" fill="#102A22" stroke="#2A5A47"/>
    <circle cx="56" cy="211" r="3.2" fill="#5BD6A4"/>
    <text x="68" y="216" class="mono" font-size="11.5" fill="#7FE3BA">28 / 28 ТЕСТОВ</text>
  </g>

  <!-- col 2 -->
  <g>
    <rect x="388" y="86" width="7" height="7" rx="1" transform="rotate(45 391.5 89.5)" fill="#E28A3C"/>
    <text x="406" y="96" class="mono" font-size="12" letter-spacing="2" fill="#E28A3C">ФОКУС</text>
    <text x="388" y="134" class="sans" font-size="26" font-weight="600" fill="#F4F0E8">C# и данные</text>
    <text x="388" y="162" class="sans" font-size="16.5" fill="#98A4B3">Архитектура, тесты,</text>
    <text x="388" y="184" class="sans" font-size="16.5" fill="#98A4B3">чистый SQL.</text>
    <text x="388" y="216" class="mono" font-size="12" fill="#6E7B8B">УЧУСЬ КАЖДЫЙ ДЕНЬ</text>
  </g>

  <!-- col 3 -->
  <g>
    <rect x="708" y="86" width="7" height="7" rx="1" transform="rotate(45 711.5 89.5)" fill="#E28A3C"/>
    <text x="726" y="96" class="mono" font-size="12" letter-spacing="2" fill="#E28A3C">ВНЕ КОДА</text>
    <text x="708" y="134" class="sans" font-size="26" font-weight="600" fill="#F4F0E8">Моды и стратегии</text>
    <text x="708" y="162" class="sans" font-size="16.5" fill="#98A4B3">Переводы интерфейсов,</text>
    <text x="708" y="184" class="sans" font-size="16.5" fill="#98A4B3">10+ игр.</text>
    <text x="708" y="216" class="mono" font-size="12" fill="#6E7B8B">ГЛАВНОЕ — ВНИМАНИЕ</text>
  </g>
</svg>
