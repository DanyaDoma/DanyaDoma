<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="nowTitle nowDesc">
  <title id="nowTitle">Сейчас, фокус и жизнь вне кода</title>
  <desc id="nowDesc">Сейчас: ООО «Обувь» на WPF, .NET 10 и MySQL 8. Фокус: C# и данные. Вне кода: моды и стратегии.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121924"/>
      <stop offset="1" stop-color="#0C1016"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0873A" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#E0873A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.028"/>
    </pattern>
    <style>
      .mono { font-family: 'Cascadia Code', 'SF Mono', Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: Bahnschrift, 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="230" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="230" rx="24" fill="url(#grid)"/>
  <ellipse cx="120" cy="230" rx="360" ry="180" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="228.5" rx="23.5" fill="none" stroke="#2A3442" stroke-width="1.5"/>

  <line x1="416" y1="40" x2="416" y2="190" stroke="#1F2834"/>
  <line x1="784" y1="40" x2="784" y2="190" stroke="#1F2834"/>

  <!-- 01 -->
  <text x="48" y="62" class="mono" font-size="11" letter-spacing="2.2" fill="#E0873A">01</text>
  <text x="76" y="62" class="mono" font-size="11" letter-spacing="2.2" fill="#7F8A99">СЕЙЧАС</text>
  <text x="48" y="112" class="sans" font-size="27" font-weight="600" fill="#F3EFE7">ООО «Обувь»</text>
  <text x="48" y="140" class="mono" font-size="14" fill="#9AA5B4">WPF · .NET 10 · MySQL 8</text>
  <line x1="48" y1="160" x2="368" y2="160" stroke="#1F2834"/>
  <text x="48" y="182" class="mono" font-size="12" fill="#6E7A8A">4 задания · 12 таблиц · 28 тестов</text>

  <!-- 02 -->
  <text x="440" y="62" class="mono" font-size="11" letter-spacing="2.2" fill="#E0873A">02</text>
  <text x="468" y="62" class="mono" font-size="11" letter-spacing="2.2" fill="#7F8A99">ФОКУС</text>
  <text x="440" y="112" class="sans" font-size="27" font-weight="600" fill="#F3EFE7">C# и данные</text>
  <text x="440" y="140" class="sans" font-size="15" fill="#9AA5B4">архитектура, SQL, интеграции</text>
  <line x1="440" y1="160" x2="760" y2="160" stroke="#1F2834"/>
  <text x="440" y="182" class="mono" font-size="12" fill="#6E7A8A">от схемы до интерфейса</text>

  <!-- 03 -->
  <text x="808" y="62" class="mono" font-size="11" letter-spacing="2.2" fill="#E0873A">03</text>
  <text x="836" y="62" class="mono" font-size="11" letter-spacing="2.2" fill="#7F8A99">ВНЕ КОДА</text>
  <text x="808" y="112" class="sans" font-size="27" font-weight="600" fill="#F3EFE7">Моды и стратегии</text>
  <text x="808" y="140" class="mono" font-size="14" fill="#9AA5B4">Cities · HoI4 · ETS2 · CK3</text>
  <line x1="808" y1="160" x2="1152" y2="160" stroke="#1F2834"/>
  <text x="808" y="182" class="mono" font-size="12" fill="#6E7A8A">переводы, тюнинг, автоматизация</text>
</svg>
